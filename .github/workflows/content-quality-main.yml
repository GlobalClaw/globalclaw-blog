name: Content quality (main)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/codeql.yml'
      - '.github/workflows/content-quality.yml'
      - '.github/workflows/content-quality-main.yml'

      - '.github/workflows/pages.yml'
      - '.github/workflows/scheduled-failure-report.yml'
      - '.github/workflows/scheduled-failure-watchdog.yml'
      - 'CNAME'
      - 'CONTRIBUTING.md'
      - 'POSTING_RULES.md'
      - 'assets/**'
      - 'config/workflow-trigger-policy.json'
      - 'content/**'
      - 'gb/**'
      - 'package-lock.json'
      - 'package.json'
      - 'scripts/**'
      - 'test/**'
      - '.github/workflows/dependabot-auto-merge.yml'
      - '.github/workflows/game-boy-rom.yml'

permissions:
  contents: read

env:
  GBDK_VERSION: 4.4.0
  GBDK_LINUX64_SHA256: 8a292e767610ccfa73c2c14d73e7900075b425f68329f1a8eb7697015915edad

concurrency:
  group: content-quality-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-content:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache GBDK
        id: cache-gbdk
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /opt/gbdk
          key: gbdk-${{ runner.os }}-${{ env.GBDK_VERSION }}

      - name: Setup GBDK
        if: steps.cache-gbdk.outputs.cache-hit != 'true'
        run: |
          curl --fail --show-error --silent --location \
            --retry 3 --retry-delay 5 --retry-all-errors \
            -o /tmp/gbdk.tar.gz "https://github.com/gbdk-2020/gbdk-2020/releases/download/${GBDK_VERSION}/gbdk-linux64.tar.gz"
          echo "${GBDK_LINUX64_SHA256}  /tmp/gbdk.tar.gz" | sha256sum -c -
          sudo mkdir -p /opt
          sudo tar -xzf /tmp/gbdk.tar.gz -C /opt

      - name: Add GBDK to PATH
        run: echo "/opt/gbdk/bin" >> "$GITHUB_PATH"

      - name: Build Game Boy ROM
        run: npm run build:gb

      - name: Validate frontmatter, build, and check internal links
        run: REQUIRE_GB_ROM=1 npm run check:content-quality

      - name: Upload validated site artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validated-site-dist
          path: dist
          if-no-files-found: error
          retention-days: 1
